<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Asahi Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap">
<style>
  /* Layout: one black column. Heading and count on top, the can in the middle, a size toggle and two sliders under it, then breathalyzer and reset low left and the bin low right. */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #9aa0a6;
    --bin-back: #15171a;
    --bin-line: #8d949c;
    --track: #2a2d31;
    --zone-low: #3fb27f;
    --zone-mid: #e0a93b;
    --zone-high: #e5484d;
    --font-display: "Space Grotesk", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
  }
  .head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-top: 24px;
    font-family: var(--font-display);
    font-weight: 700;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 6.5vw, 32px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-wrap: balance;
    color: var(--fg);
  }
  .count {
    font-size: clamp(48px, 16vw, 88px);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--fg);
  }

  /* Can */
  .arena {
    position: relative;
    z-index: 5;
    flex: 1 1 0;
    min-height: 0;
    container-type: size;
    display: grid;
    place-items: center;
    padding-block: 4px;
  }
  .can {
    all: unset;
    box-sizing: border-box;
    position: relative;
    height: calc(min(100cqh, 126cqw) * var(--k, 1));
    aspect-ratio: 188 / 340;
    cursor: pointer;
  }
  .can:focus-visible { outline: 2px solid var(--fg); outline-offset: 8px; border-radius: 12px; }
  .can img, .mini img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* Controls under the can */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
  }
  .sizes {
    display: flex;
    border: 1.5px solid var(--bin-line);
    border-radius: 999px;
    padding: 2px;
  }
  .size {
    all: unset;
    box-sizing: border-box;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    cursor: pointer;
  }
  .size[aria-checked="true"] { background: var(--fg); color: var(--bg); }
  .size:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .sliders {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
  }
  .field {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .field-row output { color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    width: 100%;
    margin: 0;
    height: 24px;
    accent-color: var(--fg);
    background: transparent;
    cursor: pointer;
  }

  /* Bottom row */
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  }
  .bin {
    position: relative;
    flex: none;
    width: clamp(104px, 31vw, 150px);
    aspect-ratio: 100 / 120;
    pointer-events: none;
  }
  .bin > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bin .back { z-index: 0; }
  .bin .front { z-index: 2; }
  .pile {
    position: absolute;
    inset: 0;
    z-index: 1;
    clip-path: polygon(10% 11.7%, 90% 11.7%, 82% 93%, 18% 93%);
  }
  .mini {
    position: absolute;
    width: 17%;
    aspect-ratio: 188 / 340;
  }

  /* Breathalyzer and reset */
  .left {
    flex: none;
    width: clamp(104px, 31vw, 150px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .meter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-family: var(--font-display);
    font-weight: 700;
  }
  .meter-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meter svg { display: block; width: 100%; height: auto; overflow: visible; }
  .needle { transform-origin: 60px 60px; transition: transform 0.7s cubic-bezier(0.3, 1.3, 0.5, 1); }
  .meter-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-top: -4px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .meter-value strong { font-size: clamp(22px, 7vw, 30px); color: var(--zone-low); font-weight: 700; }
  .meter-value strong[data-zone="mid"] { color: var(--zone-mid); }
  .meter-value strong[data-zone="high"] { color: var(--zone-high); }
  .meter-value span { font-size: 14px; color: var(--muted); }
  .reset {
    all: unset;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    height: 42px;
    border: 1.5px solid var(--bin-line);
    border-radius: 999px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg);
    cursor: pointer;
  }
  .reset:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .reset[data-armed="true"] { border-color: var(--zone-high); color: var(--zone-high); }
</style>

<script>
  (function () {
    var KEY = "asahi-tracker-state";
    var OLD_COUNT = "daasetaeller-antal";
    var OLD_TIMES = "daasetaeller-tider";
    var ROWS = 5;
    var COLS = 4;
    var CAP = ROWS * COLS;
    var HOUR = 3600000;
    var SINCE_MAX = 12;
    var WEIGHT_MIN = 40;
    var WEIGHT_MAX = 150;

    // Widmark estimate: man (r = 0.68), beer at 5 % ABV, 0.15 per mille burned per hour.
    var R = 0.68;
    var ABV = 0.05;
    var BURN_PER_HOUR = 0.15;
    var METER_MAX = 2.0;

    // Picture sizes of the two cans: width / height, and how large each is drawn.
    var CAN_LOOK = {
      350: { ratio: 188 / 340, k: 0.84, mini: 17 },
      500: { ratio: 197 / 512, k: 1, mini: 14.06 }
    };

    var can = document.getElementById("can");
    var canImg = document.getElementById("canImg");
    var bin = document.getElementById("bin");
    var pile = document.getElementById("pile");
    var countEl = document.getElementById("count");
    var bacEl = document.getElementById("bac");
    var needle = document.getElementById("needle");
    var resetBtn = document.getElementById("reset");
    var slider = document.getElementById("since");
    var sliderOut = document.getElementById("sinceOut");
    var weightSlider = document.getElementById("weight");
    var weightOut = document.getElementById("weightOut");
    var sizeBtns = document.querySelectorAll(".size");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var busy = false;
    var dragging = false;
    var armTimer = null;
    var minis = [];

    function imgSrc(ml) { return document.getElementById(ml === 500 ? "src500" : "src350").src; }

    // State: drinks (ml each), first (time of first beer), last (time of latest tap), size for the next can, pending (hours set before the first tap), weight in kg.
    var state = { drinks: [], first: null, last: null, size: 350, pending: 0, weight: 67 };

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var s = JSON.parse(raw);
          if (s && Array.isArray(s.drinks)) {
            state.drinks = s.drinks.filter(function (v) { return v === 350 || v === 500; });
            state.first = typeof s.first === "number" ? s.first : null;
            state.last = typeof s.last === "number" ? s.last : null;
            state.size = s.size === 500 ? 500 : 350;
            state.pending = typeof s.pending === "number" ? Math.max(0, Math.min(SINCE_MAX, s.pending)) : 0;
            state.weight = typeof s.weight === "number" ? Math.max(WEIGHT_MIN, Math.min(WEIGHT_MAX, s.weight)) : 67;
            if (state.drinks.length && state.first === null) state.first = Date.now();
            return;
          }
        }
      } catch (e) {}
      // Carry over the count from the earlier version of the page.
      try {
        var n = parseInt(localStorage.getItem(OLD_COUNT), 10) || 0;
        if (n > 0) {
          var t = JSON.parse(localStorage.getItem(OLD_TIMES) || "[]");
          t = Array.isArray(t) ? t.filter(function (x) { return typeof x === "number"; }) : [];
          for (var i = 0; i < n; i++) state.drinks.push(350);
          state.first = t.length ? t[0] : Date.now();
          state.last = t.length ? t[t.length - 1] : Date.now();
        }
      } catch (e) {}
    }

    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

    function count() { return state.drinks.length; }

    // Beers are assumed to be spread evenly from the first beer to the latest tap.
    function bacNow() {
      var n = count();
      if (!n) return 0;
      var first = state.first;
      var last = Math.max(state.last || first, first);
      var b = 0;
      var prev = null;
      for (var i = 0; i < n; i++) {
        var t = n === 1 ? first : first + (last - first) * i / (n - 1);
        if (prev !== null) b = Math.max(0, b - BURN_PER_HOUR * (t - prev) / HOUR);
        b += state.drinks[i] * ABV * 0.789 / (R * state.weight);
        prev = t;
      }
      return Math.max(0, b - BURN_PER_HOUR * (Date.now() - prev) / HOUR);
    }

    function sinceHours() {
      if (!count()) return state.pending;
      return Math.max(0, Math.min(SINCE_MAX, (Date.now() - state.first) / HOUR));
    }

    function formatSince(h) {
      var mins = Math.round(h * 60);
      if (mins < 1) return "Now";
      var hh = Math.floor(mins / 60);
      var mm = mins % 60;
      if (!hh) return mm + "m ago";
      return hh + "h" + (mm ? " " + mm + "m" : "") + " ago";
    }

    function renderCount() { countEl.textContent = String(count()); }

    function renderMeter() {
      var b = bacNow();
      var f = Math.min(b / METER_MAX, 1);
      needle.style.transform = "rotate(" + (-90 + 180 * f) + "deg)";
      bacEl.textContent = b.toFixed(2);
      bacEl.setAttribute("data-zone", b < 0.5 ? "low" : (b < 1.0 ? "mid" : "high"));
    }

    function renderSlider() {
      if (dragging) return;
      var h = sinceHours();
      slider.value = String(h);
      sliderOut.textContent = formatSince(h);
    }

    function renderWeight() {
      weightSlider.value = String(state.weight);
      weightOut.textContent = state.weight + " kg";
    }

    function renderSizes() {
      for (var i = 0; i < sizeBtns.length; i++) {
        sizeBtns[i].setAttribute("aria-checked", String(parseInt(sizeBtns[i].dataset.ml, 10) === state.size));
      }
      var look = CAN_LOOK[state.size];
      canImg.src = imgSrc(state.size);
      can.style.aspectRatio = String(look.ratio);
      can.style.setProperty("--k", String(look.k));
    }

    function rnd(i, k) {
      var x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    // Cans stand upright in rows of four: the first row in front, each new row behind and a little higher.
    function makeMini(slot, ml) {
      var look = CAN_LOOK[ml === 500 ? 500 : 350];
      var row = Math.floor(slot / COLS);
      var col = slot % COLS;
      var center = 28.5 + col * 14.5 + (row % 2 ? 3.5 : 0);
      var el = document.createElement("div");
      el.className = "mini";
      el.style.width = look.mini + "%";
      el.style.aspectRatio = String(look.ratio);
      el.style.left = (center - look.mini / 2) + "%";
      el.style.bottom = (7 + row * 14) + "%";
      el.style.zIndex = String((ROWS - row) * 10 + col);
      el.dataset.rot = "0";
      var img = document.createElement("img");
      img.alt = "";
      img.draggable = false;
      img.src = imgSrc(ml);
      el.appendChild(img);
      pile.appendChild(el);
      return el;
    }

    function restorePile() {
      var n = count();
      var slots = Math.min(n, CAP);
      for (var s = 0; s < slots; s++) {
        var j = s + CAP * Math.floor((n - 1 - s) / CAP);
        minis[s] = makeMini(s, state.drinks[j]);
      }
    }

    function targetFor(n) {
      var slot = (n - 1) % CAP;
      if (minis[slot] && minis[slot].parentNode) minis[slot].parentNode.removeChild(minis[slot]);
      var el = makeMini(slot, state.drinks[n - 1]);
      minis[slot] = el;
      el.style.visibility = "hidden";
      return el;
    }

    function throwCan(target) {
      var c = can.getBoundingClientRect();
      var t = target.getBoundingClientRect();
      var dx = (t.left + t.width / 2) - (c.left + c.width / 2);
      var dy = (t.top + t.height / 2) - (c.top + c.height / 2);
      var scale = target.offsetWidth / can.offsetWidth;
      var rot = (parseFloat(target.dataset.rot) || 0) + 360;
      var lift = Math.max(100, c.height * 0.6);
      var duration = reduce ? 200 : 680;

      return can.animate([
        { transform: "translate(0px, 0px) rotate(0deg) scale(1)", offset: 0 },
        { transform: "translate(" + (dx * 0.5) + "px, " + (dy * 0.5 - lift) + "px) rotate(" + (rot * 0.5) + "deg) scale(0.6)", offset: 0.5 },
        { transform: "translate(" + dx + "px, " + dy + "px) rotate(" + rot + "deg) scale(" + scale + ")", offset: 1 }
      ], { duration: duration, easing: "cubic-bezier(0.3, 0.1, 0.6, 1)", fill: "forwards" }).finished;
    }

    function landed(target) {
      target.style.visibility = "visible";
      var anims = can.getAnimations();
      for (var i = 0; i < anims.length; i++) anims[i].cancel();
      if (reduce) { busy = false; return; }
      bin.animate([
        { transform: "translateY(0px)" },
        { transform: "translateY(5px)", offset: 0.3 },
        { transform: "translateY(0px)" }
      ], { duration: 260, easing: "ease-out" });
      can.animate([
        { transform: "scale(0.2)", opacity: 0 },
        { transform: "scale(1.06)", opacity: 1, offset: 0.7 },
        { transform: "scale(1)", opacity: 1 }
      ], { duration: 280, easing: "ease-out" }).finished.then(function () { busy = false; }, function () { busy = false; });
    }

    can.addEventListener("click", function () {
      if (busy) return;
      busy = true;
      var now = Date.now();
      if (!count()) state.first = now - state.pending * HOUR;
      state.drinks.push(state.size);
      state.last = now;
      save();
      renderCount();
      renderMeter();
      renderSlider();
      var target = targetFor(count());
      throwCan(target).then(function () { landed(target); }, function () { target.style.visibility = "visible"; busy = false; });
    });

    for (var i = 0; i < sizeBtns.length; i++) {
      sizeBtns[i].addEventListener("click", function () {
        if (busy) return;
        state.size = parseInt(this.dataset.ml, 10) === 500 ? 500 : 350;
        save();
        renderSizes();
      });
    }

    slider.addEventListener("pointerdown", function () { dragging = true; });
    window.addEventListener("pointerup", function () {
      if (!dragging) return;
      dragging = false;
      renderSlider();
    });
    slider.addEventListener("input", function () {
      var h = parseFloat(slider.value) || 0;
      if (count()) state.first = Date.now() - h * HOUR;
      else state.pending = h;
      sliderOut.textContent = formatSince(h);
      save();
      renderMeter();
    });

    weightSlider.addEventListener("input", function () {
      var w = Math.round(parseFloat(weightSlider.value) || 67);
      state.weight = Math.max(WEIGHT_MIN, Math.min(WEIGHT_MAX, w));
      weightOut.textContent = state.weight + " kg";
      save();
      renderMeter();
    });

    function disarm() {
      resetBtn.setAttribute("data-armed", "false");
      resetBtn.textContent = "Reset";
      if (armTimer) { clearTimeout(armTimer); armTimer = null; }
    }

    resetBtn.addEventListener("click", function () {
      if (busy) return;
      if (resetBtn.getAttribute("data-armed") !== "true") {
        resetBtn.setAttribute("data-armed", "true");
        resetBtn.textContent = "Tap again";
        armTimer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      state.drinks = [];
      state.first = null;
      state.last = null;
      state.pending = 0;
      minis = [];
      pile.innerHTML = "";
      save();
      renderCount();
      renderMeter();
      renderSlider();
    });

    load();
    restorePile();
    renderCount();
    renderSizes();
    renderWeight();
    renderMeter();
    renderSlider();
    setInterval(function () { renderMeter(); renderSlider(); }, 30000);
  })();
</script>
